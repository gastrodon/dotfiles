name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  nixfmt:
    name: nixfmt
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: check formatting
        run: |
          nix shell nixpkgs#nixfmt -c sh -c \
            'find . -name "*.nix" ! -path "./.git/*" | xargs nixfmt --check'

  build:
    name: build (${{ matrix.target }}, ${{ matrix.channel }})
    needs: nixfmt
    runs-on: ${{ matrix['runs-on'] || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    strategy:
      fail-fast: false
      matrix:
        channel: [current, latest]
        target:
          - stone
          - twink
          - stone-installer
          - twink-installer
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve target
        id: vars
        run: |
          case "${{ matrix.target }}" in
            stone)              attr=nixosConfigurations.stone.config.system.build.toplevel ;;
            twink)               attr=nixosConfigurations.twink.config.system.build.toplevel ;;
            stone-installer)     attr=nixosConfigurations.stone-installer.config.system.build.isoImage ;;
            twink-installer)     attr=nixosConfigurations.twink-installer.config.system.build.isoImage ;;
          esac
          echo "attr=$attr" >> "$GITHUB_OUTPUT"

      - name: flake update
        if: matrix.channel == 'latest'
        run: nix flake update --impure

      - name: build
        run: nix build ".#${{ steps.vars.outputs.attr }}" --impure
